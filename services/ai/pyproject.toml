[project]
name = "attendance-ai"
version = "0.1.0"
description = "Internal inference service for School Face Attendance"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.0",
    "fastapi-cli>=0.0.32",
    "onnxruntime>=1.31.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

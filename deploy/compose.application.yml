services:
  web:
    build:
      context: ../apps/web
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?Set public HTTPS API base}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m
  api:
    build:
      context: ../services/api
    environment:
      API_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:?Set private PostgreSQL URL}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set exact HTTPS web origin}
      SCHOOL_ID: ${SCHOOL_ID:?Set school UUID}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 15s
      timeout: 4s
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
  ai:
    build:
      context: ../services/ai
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set strong service-to-service token}
    expose:
      - "8001"
    healthcheck:
      # Runtime health only; model readiness intentionally remains 503 in foundation.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/v1/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0

name: Foundation CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: attendance
          POSTGRES_DB: attendance
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://attendance:ci-only-disposable-password@localhost:5432/attendance?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14.8'
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - name: Install locked dependencies
        run: |
          mkdir -p .tools
          ln -s "$(command -v uv)" .tools/uv
          make setup
      - name: Lint, typecheck and tests
        run: make check
      - name: Migrations and database integrity
        run: make DATABASE_URL="$DATABASE_URL" migrate db-test
      - name: Build all services
        run: make build
      - name: Validate Compose
        run: make compose-check
      - name: Scan Go dependencies
        working-directory: services/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Scan committed secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact .
      - name: Scan Python locked dependencies
        working-directory: services/ai
        run: |
          uv export --locked --no-dev --no-hashes -o /tmp/ai-requirements.txt > /dev/null
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r /tmp/ai-requirements.txt
      - name: npm audit and expiring build-tool exception gate
        id: npm-audit
        working-directory: apps/web
        run: |
          npm audit --json > npm-audit.json || true
          node ../../scripts/check_web_audit.mjs npm-audit.json .output/server
      - name: Install browser for real cross-origin regression tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium --only-shell
      - name: Fresh install and browser regression tests
        working-directory: apps/web
        env:
          E2E_DATABASE_URL: postgresql://attendance:ci-only-disposable-password@localhost:5432/attendance?sslmode=disable
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-audit
          path: apps/web/npm-audit.json

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, api, ai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image without publishing
        run: |
          case "${{ matrix.service }}" in
            web) context=apps/web ;;
            api) context=services/api ;;
            ai) context=services/ai ;;
          esac
          docker build -t "attendance-${{ matrix.service }}:ci" "$context"

services:
  init-models:
    build:
      context: ../services/ai
    user: "0:0"
    command: ["python", "-m", "app.models", "--directory", "/models"]
    volumes:
      - model_data:/models
    restart: "no"
  web:
    build:
      context: ../apps/web
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?Set public HTTPS API base}
    ports:
      - target: 3000
        published: ${WEB_HOST_PORT:-3001}
        host_ip: 127.0.0.1
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m
  migrate:
    build:
      context: ../services/api
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${MIGRATION_DATABASE_URL:?Set least-privilege migration PostgreSQL URL}
    command: ["goose", "-dir", "/app/migrations", "up"]
    restart: "no"
  api:
    build:
      context: ../services/api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      API_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:?Set private PostgreSQL URL}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set exact HTTPS web origin}
      ALLOW_LOCAL_WEB_PORT_RANGE: ${ALLOW_LOCAL_WEB_PORT_RANGE:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8001}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set strong service-to-service token}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 15s
      timeout: 4s
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
  ai:
    build:
      context: ../services/ai
    depends_on:
      init-models:
        condition: service_completed_successfully
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set strong service-to-service token}
      AI_MODELS_DIR: /models
      AI_TEMPLATE_KEY_BASE64: ${AI_TEMPLATE_KEY_BASE64:?Set private template encryption key}
      AI_TEMPLATE_KEY_ID: ${AI_TEMPLATE_KEY_ID:?Set template key identifier}
      # Camera thresholds remain provisional until independent evaluation.
      AI_MATCH_THRESHOLD: ${AI_MATCH_THRESHOLD:-0.8}
      AI_MATCH_MARGIN: ${AI_MATCH_MARGIN:-0.1}
      AI_LIVENESS_THRESHOLD: ${AI_LIVENESS_THRESHOLD:-0.95}
      AI_DUPLICATE_THRESHOLD: ${AI_DUPLICATE_THRESHOLD:-0.85}
      AI_RECOGNITION_APPROVAL_PATH: ${AI_RECOGNITION_APPROVAL_PATH:-}
      AI_RECOGNITION_APPROVAL_SHA256: ${AI_RECOGNITION_APPROVAL_SHA256:-}
    volumes:
      - model_data:/models:ro
    expose:
      - "8001"
    healthcheck:
      # Liveness here checks process availability; API writes require a fresh verified match.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/v1/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
volumes:
  model_data: {}
